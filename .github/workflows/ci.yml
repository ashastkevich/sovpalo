# Проверки и выкатка (ADR-0001, раздел 8). Образ собирается здесь, на сервере сборки нет.
# Пока staging нет, каждый push в main выкатывается на prod.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:brands data/brands.sample.json

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Образ сайта
        uses: docker/build-push-action@v6
        with:
          target: app
          push: true
          build-args: SITE_URL=${{ vars.SITE_URL || 'https://sovpalo.net' }}
          tags: |
            ghcr.io/ashastkevich/sovpalo:${{ github.sha }}
            ghcr.io/ashastkevich/sovpalo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Образ для миграций и импорта
        uses: docker/build-push-action@v6
        with:
          target: tools
          push: true
          tags: |
            ghcr.io/ashastkevich/sovpalo-tools:${{ github.sha }}
            ghcr.io/ashastkevich/sovpalo-tools:latest
          cache-from: type=gha

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: SSH-ключ
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Выкатка
        env:
          TARGET: deploy@${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh_() { ssh -i ~/.ssh/deploy -o BatchMode=yes "$TARGET" "$@"; }
          # Файлы стека из репозитория; nginx/default.conf живёт на сервере (docs/it/deploy.md)
          scp -i ~/.ssh/deploy -o BatchMode=yes deploy/compose.yml deploy/deploy.sh deploy/backup.sh "$TARGET":/srv/sovpalo/
          scp -i ~/.ssh/deploy -o BatchMode=yes deploy/nginx/proxy.inc deploy/nginx/https.conf.example "$TARGET":/srv/sovpalo/nginx/
          # Токен живёт только пока идёт этот запуск
          printf '%s' "$TOKEN" | ssh_ docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ssh_ /srv/sovpalo/deploy.sh "${{ github.sha }}"
          ssh_ docker logout ghcr.io
