# Пока домен не переключён на сервер, сайт отдаётся по HTTP.
# После выпуска сертификата этот файл заменяется на https.conf.example (docs/it/deploy.md).
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include /etc/nginx/conf.d/proxy.inc;
    }
}
